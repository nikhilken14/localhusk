[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "husk-local-assistant"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "pydantic-settings>=2.5,<3.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.9,<1.0",  # file uploads for chat attachments
  "openai>=1.50,<3.0",
  "anthropic>=0.34,<1.0",
  "google-genai>=1.0,<2.0",
  "keyring>=25.0,<26.0",
  "rich>=13.7,<15.0",
  "httpx>=0.27,<1.0",
  "pypdf>=4.0,<7.0",
  "python-docx>=1.1,<2.0",
  "openpyxl>=3.1,<4.0",
  "tzdata>=2024.1; platform_system == 'Windows'",  # zoneinfo needs this on Windows (cron timezones)
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0", "ruff>=0.6,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"
