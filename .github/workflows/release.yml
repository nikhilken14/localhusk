name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native CLI (version from tag)
        run: |
          export HUSK_VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version ${HUSK_VERSION}"
          cd cli-rs
          cargo build --release
          strip target/release/husk || true
          # Fail the build if the binary does not report the tag version
          ./target/release/husk --version | tee /tmp/husk-version.txt
          grep -q "${HUSK_VERSION}" /tmp/husk-version.txt
          mkdir -p ../builds/linux
          cp target/release/husk ../builds/linux/husk
          chmod +x ../builds/linux/husk

      - name: Pack Linux zip
        run: |
          VERSION="${GITHUB_REF_NAME}"
          STAGE="localhusk-${VERSION}-linux-x86_64"
          mkdir -p "/tmp/${STAGE}"
          rsync -a \
            --exclude '.git' \
            --exclude 'cli-rs/target' \
            --exclude '**/__pycache__' \
            --exclude '**/*.pyc' \
            --exclude 'ui/node_modules' \
            --exclude 'ui/dist' \
            --exclude 'builds/macos' \
            --exclude 'builds/windows' \
            ./ "/tmp/${STAGE}/"
          mkdir -p "/tmp/${STAGE}/builds/linux" "/tmp/${STAGE}/cli-rs/target/release"
          cp builds/linux/husk "/tmp/${STAGE}/builds/linux/husk"
          cp builds/linux/husk "/tmp/${STAGE}/cli-rs/target/release/husk"
          chmod +x "/tmp/${STAGE}/install.sh" "/tmp/${STAGE}/builds/linux/husk" "/tmp/${STAGE}/cli-rs/target/release/husk"
          cd /tmp
          zip -r "${STAGE}.zip" "${STAGE}"
          sha256sum "${STAGE}.zip" | tee "${STAGE}.zip.sha256"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: |
            /tmp/localhusk-*-linux-x86_64.zip
            /tmp/localhusk-*-linux-x86_64.zip.sha256
          retention-days: 5
          if-no-files-found: error

      - name: Upload Linux binary (for repo update)
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: builds/linux/husk
          retention-days: 1
          if-no-files-found: error

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native CLI (version from tag)
        shell: pwsh
        run: |
          $env:HUSK_VERSION = $env:GITHUB_REF_NAME.TrimStart('v')
          Write-Host "Building version $env:HUSK_VERSION"
          Set-Location cli-rs
          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
          # Fail the build if the binary does not report the tag version
          $out = & .\target\release\husk.exe --version
          Write-Host $out
          if (-not ($out -match [regex]::Escape($env:HUSK_VERSION))) { throw "Binary version mismatch: $out" }
          New-Item -ItemType Directory -Force -Path ..\builds\windows | Out-Null
          Copy-Item target\release\husk.exe ..\builds\windows\husk.exe

      - name: Pack Windows zip
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME
          $STAGE = "localhusk-$VERSION-windows-x86_64"
          $OUT = Join-Path $env:RUNNER_TEMP $STAGE
          if (Test-Path $OUT) { Remove-Item $OUT -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $OUT | Out-Null

          # Copy everything except .git, then remove build junk (nested paths can't be excluded by top-level name)
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' } | ForEach-Object {
            Copy-Item $_.FullName -Destination (Join-Path $OUT $_.Name) -Recurse -Force
          }
          foreach ($p in @('cli-rs\target', 'ui\node_modules', 'ui\dist', 'builds\macos', 'builds\linux')) {
            $full = Join-Path $OUT $p
            if (Test-Path $full) { Remove-Item $full -Recurse -Force }
          }

          New-Item -ItemType Directory -Force -Path (Join-Path $OUT 'builds\windows') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $OUT 'cli-rs\target\release') | Out-Null
          Copy-Item 'builds\windows\husk.exe' (Join-Path $OUT 'builds\windows\husk.exe') -Force
          Copy-Item 'builds\windows\husk.exe' (Join-Path $OUT 'cli-rs\target\release\husk.exe') -Force

          $zipPath = Join-Path $env:RUNNER_TEMP "$STAGE.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $OUT '*') -DestinationPath $zipPath -Force

          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLower()
          "$hash  $STAGE.zip" | Out-File -Encoding ascii (Join-Path $env:RUNNER_TEMP "$STAGE.zip.sha256")
          Write-Host "Created $zipPath"
          Write-Host "SHA256: $hash"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            ${{ runner.temp }}/localhusk-*-windows-x86_64.zip
            ${{ runner.temp }}/localhusk-*-windows-x86_64.zip.sha256
          retention-days: 5
          if-no-files-found: error

      - name: Upload Windows binary (for repo update)
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: builds/windows/husk.exe
          retention-days: 1
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: artifacts

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: artifacts

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ls -la artifacts/
          cat > body.md <<'EOF'
          ## LocalHusk __TAG__

          Open-source, local-first AI assistant for **Linux** and **Windows** (x86_64).

          ### Quick install

          **Linux / WSL2**
          ```bash
          curl -fsSL https://raw.githubusercontent.com/__REPO__/main/install.sh | bash
          ```

          **Windows (PowerShell)**
          ```powershell
          irm https://raw.githubusercontent.com/__REPO__/main/install.ps1 | iex
          ```

          ### Checksums (SHA-256)
          ```
          EOF
          cat artifacts/*.sha256 >> body.md
          echo '```' >> body.md
          sed -i "s|__TAG__|${TAG}|g; s|__REPO__|${REPO}|g" body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: body.md
          generate_release_notes: true

  update-builds:
    name: Replace old builds/ binaries on main
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main (not the tag)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete old builds
        run: |
          git rm -rf --ignore-unmatch builds/windows builds/linux
          rm -rf builds/windows builds/linux
          mkdir -p builds/windows builds/linux

      - name: Download new Linux binary
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: builds/linux

      - name: Download new Windows binary
        uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: builds/windows

      - name: Commit and push new builds
        run: |
          chmod +x builds/linux/husk
          ls -la builds/windows builds/linux
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -f builds/
          git update-index --chmod=+x builds/linux/husk
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: refresh builds/ binaries for ${GITHUB_REF_NAME}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
