name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "builds/**"
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (tests + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install "./husk[dev]"

      - name: Ruff
        run: |
          cd husk
          ruff check src tests || true   # non-blocking style for first release; tighten later

      - name: Pytest
        run: |
          cd husk
          pytest -q --tb=short

  ui:
    name: UI (TypeScript + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install and build
        working-directory: ui
        run: |
          npm ci || npm install
          npm run build

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check / build
        shell: bash
        working-directory: cli-rs
        env:
          HUSK_VERSION: 0.0.0-ci
        run: |
          cargo check --release
          cargo build --release

      - name: Verify binary and version injection
        shell: bash
        working-directory: cli-rs
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=target/release/husk.exe; else BIN=target/release/husk; fi
          test -f "$BIN"
          "$BIN" --version | tee /tmp/v.txt
          grep -q "0.0.0-ci" /tmp/v.txt

  install-linux:
    name: Installer smoke (Linux)
    runs-on: ubuntu-latest
    needs: [python, rust]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build CLI for installer
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source "$HOME/.cargo/env"
          fi
          # Subshell: keep the repo root as the working directory for the lines below.
          (cd cli-rs && cargo build --release)
          strip cli-rs/target/release/husk || true
          mkdir -p builds/linux
          cp cli-rs/target/release/husk builds/linux/husk
          chmod +x builds/linux/husk install.sh

      - name: Run installer (user home)
        run: |
          export HUSK_HOME="$RUNNER_TEMP/husk-home"
          ./install.sh
          test -x "$HUSK_HOME/bin/husk"
          test -d "$HUSK_HOME/venv"
          "$HUSK_HOME/bin/husk" --help 2>/dev/null || "$HUSK_HOME/bin/husk" -h 2>/dev/null || true
