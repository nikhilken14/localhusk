name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (tests + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install "./husk[dev]"

      - name: Ruff
        run: |
          cd husk
          ruff check src tests || true   # non-blocking style for first release; tighten later
          # Prefer failing only on serious issues once baseline is clean

      - name: Pytest
        run: |
          cd husk
          pytest -q --tb=short

  ui:
    name: UI (TypeScript + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install and build
        working-directory: ui
        run: |
          npm ci || npm install
          npm run build

  rust:
    name: Rust (check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check / build
        run: |
          cd cli-rs
          cargo check --release
          cargo build --release
          test -x target/release/husk

  install-linux:
    name: Installer smoke (Linux)
    runs-on: ubuntu-latest
    needs: [python, rust]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build CLI for installer
        run: |
          # Use system or install Rust if needed
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source "$HOME/.cargo/env"
          fi
          cd cli-rs && cargo build --release && strip target/release/husk || true
          mkdir -p builds/linux
          cp cli-rs/target/release/husk builds/linux/husk
          chmod +x builds/linux/husk install.sh

      - name: Run installer (user home)
        run: |
          export HUSK_HOME="$RUNNER_TEMP/husk-home"
          ./install.sh
          test -x "$HUSK_HOME/bin/husk"
          test -d "$HUSK_HOME/venv"
          # Launcher should at least print help / version without crashing
          "$HUSK_HOME/bin/husk" --help 2>/dev/null || "$HUSK_HOME/bin/husk" -h 2>/dev/null || true

  # Windows installer smoke is optional / slower; keep for later if needed.
